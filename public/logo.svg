<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Brain Trainer mark: a two-lobed brain with a pulse line, white on green.
       Source for the PWA icons (npm run icons). -->
  <rect width="512" height="512" fill="#43a047"/>
  <g fill="none" stroke="#fff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <!-- left lobe -->
    <path d="M248 132c-14-22-40-34-66-28-24 6-40 26-44 48-26 6-44 30-42 58 2 14 8 26 18 34-14 14-20 36-12 56 8 22 30 36 54 34 6 26 30 44 58 42 14-1 26-8 34-18z"/>
    <!-- right lobe -->
    <path d="M264 132c14-22 40-34 66-28 24 6 40 26 44 48 26 6 44 30 42 58-2 14-8 26-18 34 14 14 20 36 12 56-8 22-30 36-54 34-6 26-30 44-58 42-14-1-26-8-34-18z"/>
  </g>
  <!-- pulse across both lobes -->
  <path d="M150 262h44l20-40 32 84 28-64 18 20h70" fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
